<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Custom Activity Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/@salesforce-ux/design-system/assets/styles/salesforce-lightning-design-system.min.css">
    <style>
        body { padding: 20px; background-color: #fff; }
        .setup-step { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

    <div id="step1" class="setup-step active">
        <h2 class="slds-text-heading_medium">Configuración de la Actividad</h2>
        <div class="slds-form-element slds-m-top_medium">
            <label class="slds-form-element__label" for="message-input">Mensaje para el contacto:</label>
            <div class="slds-form-element__control">
                <input type="text" id="message-input" class="slds-input" placeholder="Ej: ¡Hola {{Contact.Attribute.FirstName}}!" />
            </div>
        </div>
    </div>

    <script src="js/postmonger.js"></script>
    <script src="js/customActivity.js"></script>
</body>
</html>
