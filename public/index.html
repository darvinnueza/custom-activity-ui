<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Activity UI — VoiceBot</title>

    <!-- IMPORTANTE: NO ocultamos el body. Mostramos 403 por defecto -->
    <style>
      body { margin: 0; font-family: sans-serif; }
      #forbidden { text-align: center; padding-top: 80px; }
      #app { display: none; }
    </style>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <!-- 403 visible por defecto -->
    <div id="forbidden">
      <h1 style="color:#c00;">403 - Acceso Denegado</h1>
      <p>Esta aplicación solo es accesible desde Salesforce Marketing Cloud (Journey Builder).</p>
    </div>

    <!-- APP real (oculta hasta estar en iframe) -->
    <div id="app">
      <div class="app-header">Custom Activity UI — VoiceBot</div>

      <div class="container">
        <div class="card">
          <section id="stepContact">
            <h2>Configuración de Lista de Contactos</h2>
            <p class="subtitle">Elige una lista de contactos existente o define una nueva.</p>

            <label for="contactListSelect">Lista de Contactos Existente</label>
            <select id="contactListSelect"><option>Cargando...</option></select>

            <div class="checkbox">
              <input type="checkbox" id="newListCheck" />
              <label for="newListCheck">Definir una Nueva Lista de Contactos</label>
            </div>

            <label for="newListName">Nombre de la Nueva Lista</label>
            <div class="inline-create">
              <input id="newListName" type="text" placeholder="Ingrese el nombre..." />
              <button id="btnCreateList" type="button" disabled>Crear Lista</button>
            </div>

            <small id="createStatus" class="status"></small>

            <div class="nav">
              <button id="btnNext" type="button" disabled>Siguiente</button>
            </div>
          </section>

          <section id="stepCampaign" style="display:none;">
            <h2>Configuración de Campaña</h2>
            <select id="campaignSelect"><option value="">Cargando...</option></select>
            <div class="nav">
              <button id="btnBack" type="button">Atrás</button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- Si es iframe (Journey Builder), mostramos la app -->
    <script>
      if (window.self !== window.top) {
        document.getElementById("forbidden").style.display = "none";
        document.getElementById("app").style.display = "block";
      }
    </script>

    <script src="/js/postmonger.js"></script>
    <script src="/js/customActivity.js"></script>
    <script src="/js/ui.js"></script>
  </body>
</html>
