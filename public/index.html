<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Activity UI — VoiceBot</title>

    <style>
      body { display: none; } /* Nadie ve nada hasta que el JS autorice */
    </style>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app-header">Custom Activity UI — VoiceBot</div>

    <div class="container">
      <div class="card">
        <section id="stepContact">
          <h2>Configuración de Lista de Contactos</h2>
          <p class="subtitle">Elige una lista de contactos existente o define una nueva.</p>
          
          <label for="contactListSelect">Lista de Contactos Existente</label>
          <select id="contactListSelect"><option>Cargando...</option></select>

          <div class="checkbox">
            <input type="checkbox" id="newListCheck" />
            <label for="newListCheck">Definir una Nueva Lista de Contactos</label>
          </div>

          <label for="newListName">Nombre de la Nueva Lista</label>
          <div class="inline-create">
            <input id="newListName" type="text" placeholder="Ingrese el nombre..." />
            <button id="btnCreateList" type="button" disabled>Crear Lista</button>
          </div>
          <small id="createStatus" class="status"></small>

          <div class="nav">
            <button id="btnNext" type="button" disabled>Siguiente</button>
          </div>
        </section>

        <section id="stepCampaign" style="display:none;">
          <h2>Configuración de Campaña</h2>
          <select id="campaignSelect"><option value="">Cargando...</option></select>
          <div class="nav">
            <button id="btnBack" type="button">Atrás</button>
          </div>
        </section>
      </div>
    </div>

    <script src="js/postmonger.js"></script>
    <script src="js/customActivity.js"></script>
    
    <script>
      (function() {
        // 1. Verificamos que venga de Salesforce (la base de seguridad)
        const esIframe = window.self !== window.top;
        const vieneDeSFMC = document.referrer.includes("exacttarget.com") || 
                            document.referrer.includes("marketingcloudapps.com");

        // 2. Pedimos la clave secreta
        const miClaveSecreta = "voicebot2026"; // <--- CAMBIA ESTO POR LA TUYA
        const passwordIngresado = prompt("Seguridad VoiceBot: Ingrese el Token de Acceso");

        // 3. Si algo falla, bloqueamos de verdad
        if (!esIframe || !vieneDeSFMC || passwordIngresado !== miClaveSecreta) {
          document.documentElement.innerHTML = `
            <body style="font-family:sans-serif; text-align:center; padding-top:50px; background:#f4f4f4;">
              <h1 style="color:#d32f2f;">403 - Acceso Restringido</h1>
              <p>Token incorrecto o acceso fuera de Salesforce Marketing Cloud.</p>
              <img src="https://cdn-icons-png.flaticon.com/512/1160/1160515.png" width="100" style="margin-top:20px;">
            </body>`;
          throw new Error("Fallo en autenticación manual");
        } else {
          // Si todo está OK, encendemos las luces
          document.body.style.display = "block";
          console.log("Acceso concedido");
        }
      })();
    </script>

    <script src="js/ui.js"></script>
  </body>
</html>
